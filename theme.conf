[General]
# Path to the wallpaper. If it's in the assets folder, use "assets/background.jpg"
background=assets/background.jpg

# Colors
accentColor=#FF5722
autoColor=true
use24HourClock=false
backgroundColor=#1A1C18
textColor=#E3E3DC

# Font family. Override with any installed system font.
fontFamily=Google Sans Flex Freeze

# Which label to show on the login card: "displayName" (full name from
# GECOS, falls back to username) or "username" (login name only).
userLabelMode=displayName

# Power button visibility (top-right corner).
showSuspend=true
showRestart=true
showShutdown=true
